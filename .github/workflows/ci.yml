name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (restore, build & test)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 9
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        working-directory: backend
        run: dotnet restore Vingo.sln

      - name: Build (Release)
        working-directory: backend
        run: dotnet build Vingo.sln --no-restore -c Release

      - name: Test
        working-directory: backend
        run: dotnet test Vingo.sln --no-build -c Release --logger "trx;LogFileName=results.trx"

  frontend:
    name: Frontend (typecheck & build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: TypeScript
        run: npm run typecheck

      # ISR prerendering fetches the public read API at build time, the same
      # way Vercel production builds do. Read-only GETs. Point this at another
      # API with the API_ORIGIN repository variable.
      - name: Build (against the public read API)
        run: npm run build
        env:
          API_ORIGIN: ${{ vars.API_ORIGIN || 'http://vingo-roll-api.runasp.net' }}
